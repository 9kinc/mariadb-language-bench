name: MariaDB language benchmark

on:
  push:
    branches: ['benchmark/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mariadb-language-benchmark
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DB_HOST: 127.0.0.1
      DB_USER: bench
      DB_PASSWORD: benchmark-only-password
      MYSQL_DSN: "bench:benchmark-only-password@tcp(127.0.0.1:3306)/bench?timeout=3s&readTimeout=3s&writeTimeout=3s"
      DATABASE_URL: "mysql://bench:benchmark-only-password@127.0.0.1:3306/bench"
    services:
      mariadb:
        image: mariadb:13.0.2
        env:
          MARIADB_ROOT_PASSWORD: ephemeral-root-only
          MARIADB_DATABASE: bench
          MARIADB_USER: bench
          MARIADB_PASSWORD: benchmark-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install MariaDB client and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          npm ci --prefix node --no-audit --no-fund
          mkdir -p bin
          go mod tidy
          go build -o bin/go-server ./go
          go build -o bin/load ./load
      - name: Build Rust backend
        run: cargo build --release --locked --manifest-path rust/Cargo.toml
      - name: Build PHP-FPM backend
        run: docker build -t local/php-mariadb-benchmark -f php/Dockerfile .
      - name: Seed 3 million test records
        run: |
          SECONDS=0
          mariadb --host=127.0.0.1 --user=bench --password="$DB_PASSWORD" bench < sql/seed.sql
          echo "Seeding: $SECONDS seconds" | tee seed-timing.txt
          mariadb --host=127.0.0.1 --user=bench --password="$DB_PASSWORD" --batch --skip-column-names bench -e "SELECT 'users',COUNT(*) FROM users UNION ALL SELECT 'profiles',COUNT(*) FROM profiles UNION ALL SELECT 'orders',COUNT(*) FROM orders" | tee counts.tsv
          awk '$2 != 1000000 {bad=1} END {if (NR!=3 || bad) exit 1}' counts.tsv
          mariadb --host=127.0.0.1 --user=bench --password="$DB_PASSWORD" --batch --skip-column-names -e 'SELECT VERSION()' | tee mariadb-version.txt
      - name: Run sequential HTTP concurrency benchmarks
        run: bash scripts/run.sh
      - name: Format report
        if: always()
        run: python3 scripts/report.py
      - name: Publish GitHub Actions summary
        if: always()
        run: cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurement files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mariadb-language-benchmark
          path: |
            results/
            counts.tsv
            seed-timing.txt
            mariadb-version.txt
          if-no-files-found: warn
