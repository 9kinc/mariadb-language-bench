server {
 listen 127.0.0.1:8080;
 server_name localhost;
 access_log off;
 location = /health { return 200 "ok"; }
 location = /lookup {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
  fastcgi_pass 127.0.0.1:9000;
  fastcgi_read_timeout 8s;
 }
 location / { return 404; }
}
